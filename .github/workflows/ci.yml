name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 数据库镜像含自编译的 zhparser 中文分词扩展（db/Dockerfile），
      # 测试依赖它，不能用普通 postgres 镜像替代
      - name: 构建数据库镜像
        run: docker build -t remuse-db:ci ./db

      - name: 启动数据库
        run: |
          docker run -d --name db \
            -e POSTGRES_USER=flash \
            -e POSTGRES_PASSWORD=ci-test-password \
            -e POSTGRES_DB=flash \
            -p 5432:5432 remuse-db:ci
          for i in $(seq 1 30); do
            docker exec db pg_isready -U flash -d flash && exit 0
            sleep 2
          done
          echo "数据库未在预期时间内就绪" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 数据库迁移
        working-directory: backend
        env:
          DATABASE_URL: postgresql://flash:ci-test-password@localhost:5432/flash
        run: python -m alembic upgrade head

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://flash:ci-test-password@localhost:5432/flash
          ADMIN_TOKEN: ci-admin-token
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint
